<!DOCTYPE html>
<html lang="en" class="h-full bg-[#070D19]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surfkit Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="tailwind.cdn.js"></script>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      background-color: #070D19;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      user-select: none;
    }
  </style>
</head>
<body class="flex flex-col gap-3.5">

  <!-- 1. Extension Header & Version Badge -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#161F36] border border-[#233152] text-xs text-slate-300">
      <svg class="w-3.5 h-3.5 text-indigo-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
      </svg>
      <span class="font-medium font-mono" id="popup-user-name">Surfkit user</span>
    </div>
    <div class="px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono font-medium">
      v1.0.0 Active
    </div>
  </div>

  <!-- 2. Surfkit Brand & Node Status Toggle -->
  <div class="flex items-center justify-between p-4 rounded-2xl bg-[#0F172A]/90 border border-slate-800/80 shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-400 to-teal-400 flex items-center justify-center font-black text-slate-950 text-2xl shadow-lg shadow-emerald-500/20">
        S
      </div>
      <div>
        <h3 class="text-lg font-bold text-white tracking-tight">Surfkit</h3>
        <div class="flex items-center gap-1.5 text-xs text-emerald-400 font-medium" id="toggle-status-text">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Active &amp; Ready</span>
        </div>
      </div>
    </div>
    <!-- Interactive Node Toggle Switch -->
    <button id="extension-toggle-btn" type="button" aria-label="Toggle Extension" class="w-12 h-7 bg-emerald-500 rounded-full p-1 transition-colors duration-200 focus:outline-none flex items-center justify-end cursor-pointer">
      <div class="w-5 h-5 bg-white rounded-full shadow-md transform transition-transform" id="toggle-thumb"></div>
    </button>
  </div>

  <!-- 3. Available Balance Card -->
  <div class="p-5 rounded-2xl bg-[#0F172A]/90 border border-slate-800/80 shadow-md">
    <div class="text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-1">AVAILABLE BALANCE</div>
    <div class="flex items-baseline gap-2 mb-3">
      <span class="text-4xl font-extrabold text-white tracking-tight font-mono transition-colors" id="popup-balance">$67.819</span>
      <span class="text-base font-semibold text-slate-400">USD</span>
    </div>
    <div class="flex items-center justify-between text-xs pt-2.5 border-t border-slate-800/80">
      <span class="text-slate-400">Tokens Earned:</span>
      <span class="font-mono font-bold text-emerald-400" id="popup-tokens">67819 SKIT</span>
    </div>
  </div>

  <!-- 4. Stats Summary: SKIT Tokens & Active Streak -->
  <div class="grid grid-cols-2 gap-3">
    <!-- Box 1: SKIT Tokens Balance -->
    <div class="p-3.5 rounded-2xl bg-[#0F172A]/90 border border-slate-800/80 text-center flex flex-col items-center shadow-md">
      <svg class="w-5 h-5 text-teal-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-width="2"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12m-3-9h6m-6 6h6" />
      </svg>
      <div class="text-xl font-extrabold text-white tracking-tight" id="popup-skit-tokens">67,819</div>
      <div class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mt-1">SKIT TOKENS</div>
    </div>

    <!-- Box 2: Active Streak -->
    <div class="p-3.5 rounded-2xl bg-[#0F172A]/90 border border-slate-800/80 text-center flex flex-col items-center shadow-md">
      <svg class="w-5 h-5 text-amber-400 mb-1.5" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.527.82-1.17 2.115-1.576 3.497A9.452 9.452 0 008 8c-.767 0-1.488.163-2.146.463A1 1 0 005.178 9.9c.77 1.54 2.015 2.89 3.493 3.824C9.52 14.257 10.74 15 12 15c2.761 0 5-2.239 5-5 0-2.317-1.576-4.267-3.72-4.83a8.97 8.97 0 00-.885-2.617zM10 12c-1.105 0-2-.895-2-2 0-.374.1-.724.275-1.025.334.616.828 1.127 1.442 1.475.18.102.38.188.59.255A1.996 1.996 0 0110 12z" clip-rule="evenodd" />
      </svg>
      <div class="text-xl font-extrabold text-white tracking-tight" id="popup-streak">2 Days</div>
      <div class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mt-1">ACTIVE STREAK</div>
    </div>
  </div>

  <!-- 5. Ad Frequency / Intensity Controls (Legacy - safely hidden via ENABLE_EXTERNAL_AD_INJECTION) -->
  <div id="ext-intensity-control-container" class="p-3.5 rounded-2xl bg-[#0F172A]/90 border border-slate-800/80" style="display: none !important;">
    <div class="flex items-center justify-between text-xs font-semibold mb-2.5">
      <span class="text-slate-300">Ad Frequency / Intensity</span>
      <span class="text-emerald-400 font-mono" id="intensity-label">High</span>
    </div>
    <div class="grid grid-cols-3 gap-2">
      <button type="button" class="intensity-btn py-1.5 rounded-xl text-xs font-bold transition-all bg-slate-900/60 text-slate-400 hover:text-white" data-mode="Low">Low</button>
      <button type="button" class="intensity-btn py-1.5 rounded-xl text-xs font-bold transition-all bg-slate-900/60 text-slate-400 hover:text-white" data-mode="Balanced">Balanced</button>
      <button type="button" class="intensity-btn active py-1.5 rounded-xl text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/25" data-mode="High">High</button>
    </div>
  </div>

  <!-- 6. Pause Site Row (Legacy - safely hidden via ENABLE_EXTERNAL_AD_INJECTION) -->
  <div id="ext-pause-site-container" class="flex items-center justify-between p-3 rounded-2xl bg-[#0F172A]/90 border border-slate-800/80" style="display: none !important;">
    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-300">
      <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-width="2"/>
        <line x1="2" y1="12" x2="22" y2="12" stroke-width="2"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke-width="2"/>
      </svg>
      <span id="current-site-domain">surfkit.cloud</span>
    </div>
    <button type="button" id="pause-site-btn" class="px-3 py-1 rounded-xl bg-slate-900/80 border border-slate-800 text-[11px] font-mono font-bold text-slate-400 hover:text-white">Pause Site</button>
  </div>

  <!-- 7. Action Button: Open Dashboard (links directly to https://surfkit.cloud/dashboard/) -->
  <a id="popup-dashboard-btn" href="https://surfkit.cloud/dashboard/" target="_blank" class="w-full flex items-center justify-center gap-2.5 py-3.5 rounded-2xl bg-[#161F36] hover:bg-[#1E2B4A] border border-[#233152] text-xs font-bold text-white transition-all group shadow-md cursor-pointer">
    <svg class="w-4 h-4 text-emerald-400 group-hover:rotate-45 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke-width="2"/>
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor"/>
    </svg>
    <span>Open Dashboard</span>
  </a>

  <script>
    // Feature flag: ad-network compliance & dashboard-only rewards model
    const ENABLE_EXTERNAL_AD_INJECTION = false;

    // Cross-browser runtime adapter
    const browserAPI = typeof chrome !== 'undefined' && chrome.runtime ? chrome : (typeof browser !== 'undefined' ? browser : null);

    // Sync live state from extension storage or Supabase if available
    if (browserAPI && browserAPI.storage && browserAPI.storage.local) {
      browserAPI.storage.local.get(['balanceUsd', 'tokensEarned', 'activeStreakDays', 'authUser', 'masterEnabled'], (stored) => {
        if (stored) {
          if (typeof stored.balanceUsd === 'number') {
            document.getElementById('popup-balance').textContent = '$' + stored.balanceUsd.toFixed(3);
          }
          if (typeof stored.tokensEarned === 'number') {
            document.getElementById('popup-tokens').textContent = stored.tokensEarned + ' SKIT';
            document.getElementById('popup-skit-tokens').textContent = Number(stored.tokensEarned).toLocaleString();
          }
          if (typeof stored.activeStreakDays === 'number') {
            document.getElementById('popup-streak').textContent = stored.activeStreakDays + ' Days';
          }
          if (stored.authUser && stored.authUser.email) {
            document.getElementById('popup-user-name').textContent = stored.authUser.email.split('@')[0];
          }
        }
      });
    }

    // Toggle switch handler
    const toggleBtn = document.getElementById('extension-toggle-btn');
    const toggleThumb = document.getElementById('toggle-thumb');
    const toggleStatusText = document.getElementById('toggle-status-text');
    let isActive = true;

    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        isActive = !isActive;
        if (isActive) {
          toggleBtn.className = "w-12 h-7 bg-emerald-500 rounded-full p-1 transition-colors duration-200 focus:outline-none flex items-center justify-end cursor-pointer";
          toggleStatusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span>Active &amp; Ready</span>';
          toggleStatusText.className = "flex items-center gap-1.5 text-xs text-emerald-400 font-medium";
        } else {
          toggleBtn.className = "w-12 h-7 bg-slate-700 rounded-full p-1 transition-colors duration-200 focus:outline-none flex items-center justify-start cursor-pointer";
          toggleStatusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-500"></span><span>Paused</span>';
          toggleStatusText.className = "flex items-center gap-1.5 text-xs text-slate-400 font-medium";
        }
        if (browserAPI && browserAPI.storage && browserAPI.storage.local) {
          browserAPI.storage.local.set({ masterEnabled: isActive });
        }
      });
    }

    // Fallback handlers for legacy controls to avoid undefined errors
    document.querySelectorAll('.intensity-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.intensity-btn').forEach(b => {
          b.classList.remove('active', 'bg-emerald-500', 'text-slate-950');
          b.classList.add('bg-slate-900/60', 'text-slate-400');
        });
        btn.classList.add('active', 'bg-emerald-500', 'text-slate-950');
        document.getElementById('intensity-label').textContent = btn.getAttribute('data-mode');
      });
    });
  </script>
</body>
</html>
