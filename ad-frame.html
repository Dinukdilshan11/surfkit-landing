<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Surfkit — Hosted Ad Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090e17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ad-wrapper {
      position: relative;
      width: 300px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      overflow: hidden;
      border-radius: 6px;
      background: #0c121e;
    }
    #aads-frame {
      border: 0;
      padding: 0;
      width: 300px;
      height: 250px;
      overflow: hidden;
      background-color: transparent;
      display: block;
      z-index: 2;
    }
    #ad-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #94a3b8;
      background: radial-gradient(circle at center, #111a2b 0%, #090e17 100%);
      z-index: 1;
      transition: opacity 0.3s ease;
    }
    .placeholder-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      color: #00d293;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(0, 210, 147, 0.12);
      border: 1px solid rgba(0, 210, 147, 0.25);
      padding: 3px 8px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }
    .placeholder-title {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .placeholder-sub {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0, 210, 147, 0.2);
      border-top-color: #00d293;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="ad-wrapper">
    <div id="ad-placeholder">
      <span class="placeholder-badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        Surfkit Ad Slice
      </span>
      <div class="placeholder-title">Connecting to A-Ads Partner Network</div>
      <div class="placeholder-sub">Privacy-first anonymous crypto ad stream</div>
      <div class="spinner"></div>
    </div>
    <iframe id="aads-frame"
            data-aa="2393847"
            src="https://acceptable.a-ads.com/2393847/?size=300x250"
            style="border:0; padding:0; width:300px; height:250px; overflow:hidden; background-color: transparent;"
            allowtransparency="true"
            sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>
  </div>

  <script>
    (function () {
      'use strict';

      // 1. Dynamic unit ID resolution from URL search params
      try {
        var params = new URLSearchParams(window.location.search);
        var unitId = params.get('unit') || params.get('id') || '2393847';
        var frame = document.getElementById('aads-frame');
        if (frame) {
          frame.setAttribute('data-aa', unitId);
          var srcUrl = 'https://acceptable.a-ads.com/' + encodeURIComponent(unitId) + '/?size=300x250';
          if (frame.src !== srcUrl) {
            frame.src = srcUrl;
          }
          frame.addEventListener('load', function () {
            var placeholder = document.getElementById('ad-placeholder');
            if (placeholder) {
              placeholder.style.opacity = '0';
              setTimeout(function () { placeholder.style.display = 'none'; }, 300);
            }
          });
        }
      } catch (e) {
        console.warn('[Surfkit Frame] Config error:', e);
      }

      // 2. Responsive scaling engine
      function handleResize() {
        var wrapper = document.getElementById('ad-wrapper');
        if (!wrapper) return;
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (w <= 0 || h <= 0) return;

        // Base dimensions of the A-Ads unit
        var baseW = 300;
        var baseH = 250;
        var scale = Math.min(w / baseW, h / baseH);

        // Cap scale at 1.0 (no distortion, but smooth downscale when fitted into smaller cards)
        if (scale < 1.0) {
          wrapper.style.transform = 'scale(' + scale.toFixed(4) + ')';
        } else {
          wrapper.style.transform = 'scale(1)';
        }
      }

      window.addEventListener('resize', handleResize);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', handleResize);
      } else {
        handleResize();
      }
    })();
  </script>
</body>
</html>
