<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Surfkit — Hosted Ad Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090e17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #frame {
      position: relative;
      width: 300px;
      height: 250px;
      margin: auto;
      z-index: 99998;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      overflow: hidden;
      border-radius: 6px;
      background: #0c121e;
    }
    iframe[data-aa='2462456'], #frame iframe {
      border: 0;
      padding: 0;
      width: 300px;
      height: 250px;
      overflow: hidden;
      background-color: transparent;
      display: block;
      margin: auto;
      z-index: 2;
    }
  </style>
</head>
<body>
  <!-- BEGIN AADS AD UNIT 2462456 -->
  <div id="frame" style="width: 300px;margin: auto;z-index: 99998;height: auto">
    <iframe data-aa='2462456' src='//ad.a-ads.com/2462456/?size=300x250'
            style='border:0; padding:0; width:300px; height:250px; overflow:hidden;display: block;margin: auto'
            allowtransparency='true'
            sandbox='allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox'></iframe>
  </div>
  <!-- END AADS AD UNIT 2462456 -->

  <script>
    (function () {
      'use strict';
      function handleResize() {
        var wrapper = document.getElementById('frame');
        if (!wrapper) return;
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (w <= 0 || h <= 0) return;
        var scale = Math.min(w / 300, h / 250);
        if (scale < 1.0) {
          wrapper.style.transform = 'scale(' + scale.toFixed(4) + ')';
        } else {
          wrapper.style.transform = 'scale(1)';
        }
      }
      window.addEventListener('resize', handleResize);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', handleResize);
      } else {
        handleResize();
      }
    })();
  </script>
</body>
</html>
